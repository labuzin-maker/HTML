function qualityBlock(p){const {from,to}=period(p),inR=d=>d>=from&&d<=to,live=B.filter(b=>inR(b.date));
  const dn=live.filter(b=>b.status==="done"),ns=live.filter(b=>b.status==="noshow"),rep=dn.filter(b=>B.some(x=>x.client===b.client&&x.id!==b.id&&x.status==="done"&&x.date<b.date)).length;

  const load=MASTERS.filter(m=>m.active).map(m=>{const mine=live.filter(b=>b.master===m.id&&["done","confirmed","new"].includes(b.status)),days=new Set(mine.map(b=>b.date)).size,mins=mine.reduce((a,b)=>a+b.dur,0),pc=days?Math.min(100,Math.round(mins/(days*(CLOSE-OPEN)*60)*100)):0;return{m,pc,days}});
  return `<h2>Качество и загрузка</h2><div class="grid"><div class="card"><div class="muted">Неявки</div><div class="k ${ns.length&&ns.length/(dn.length+ns.length)>.1?"neg":""}">${dn.length+ns.length?Math.round(ns.length/(dn.length+ns.length)*100):0}%</div><div class="muted sm">${ns.length} из ${dn.length+ns.length}</div></div><div class="card"><div class="muted">Повторные визиты</div><div class="k">${dn.length?Math.round(rep/dn.length*100):0}%</div><div class="muted sm">клиент уже бывал</div></div><div class="card"><div class="muted">Оценка клиентов</div><div class="k">${rv.length?"★ "+avg.toFixed(1):"—"}</div><div class="muted sm">отзывов: ${rv.length}</div></div><div class="card"><div class="muted">Новых клиентов</div><div class="k">${new Set(dn.filter(b=>firstVisit(b)).map(b=>b.client)).size}</div></div></div>
  <div class="card"><b>Загрузка мастеров</b><div class="muted sm" style="margin-bottom:6px">доля занятого времени в рабочие дни (с записями)</div>${load.map(x=>`<div style="margin-bottom:8px"><div class="row sm"><span>${esc(x.m.name)} <span class="muted">· ${x.days} раб. дн.</span></span><b>${x.pc}%</b></div><div class="bar ${x.pc<35?"low":""}"><i style="width:${x.pc}%"></i></div></div>`).join("")}<div class="muted sm">Красная полоса — мастер загружен меньше чем на треть: есть время для акций и записи новых клиентов.</div></div>
  ${rv.length?`<div class="card"><b>Последние отзывы</b>${rv.sort((a,b)=>a.review.date<b.review.date?1:-1).slice(0,5).map(b=>`<div class="rv ${b.review.r<=3?"low":""}" style="padding:4px 0 4px 8px;margin-top:6px"><div class="row sm"><b>${"★".repeat(b.review.r)}${"☆".repeat(5-b.review.r)}</b><span class="muted">${esc(mById(b.master).name)} · ${esc(cById(b.client).name.split(" ")[0])}</span></div>${b.review.t?`<div class="sm">${esc(b.review.t)}</div>`:""}</div>`).join("")}</div>`:""}`}
function vSummary(){const r=calc(S.period),days=[];for(let d=r.from;d<=r.to;d=addDays(d,1))days.push(d);const mx=Math.max(1,...days.map(d=>r.byDay[d]||0));

  const g=el.cloneNode(true);g.classList.add("dg-ghost");g.style.width=r.width+"px";g.style.height=r.height+"px";g.style.left=r.left+"px";g.style.top=r.top+"px";document.body.appendChild(g);DR.ghost=g;const tp=document.createElement("div");tp.className="dg-tip";tp.style.display="none";document.body.appendChild(tp);DR.tip=tp;el.classList.add("dragging");

  di.jc.appendChild(m)}
function tipUpdate(x,y){const t=DR.tip,di=DR.drop;if(!t)return;if(!di){t.style.display="none";return}t.style.display="block";t.className="dg-tip"+(di.ok?"":" bad");t.textContent=(di.ok?"":"⛔ занято · ")+hm(di.t)+"–"+hm(di.t+DR.b.dur)+" · "+mById(di.mid).name;

  if(b&&["new","confirmed"].includes(b.status)){b.created=TODAY;scheduleNotifs(b,"move")}}

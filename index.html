const grpOpen=b=>b.grp?B.filter(x=>x.grp===b.grp&&(x.id===b.id||["new","confirmed"].includes(x.status))):[b];
function payModal(id){

  ${dp?`<div class="note" style="margin:8px 0 0">${pp&&pp.pct>=(cl0.disc||0)?"Акция «"+esc(pp.name)+"» −"+pp.pct+"%":"Личная скидка клиента "+cl0.disc+"%"} — сумма уже уменьшена</div>`:""}${pre?`<div class="note" style="margin:8px 0 0">Предоплата ${rub(pre)} уже внесена и вычтена</div>`:""}<label class="l">Сертификат / абонемент (код)</label><div class="row gap"><input id="pcc" placeholder="6 цифр" style="margin:0"><button class="btn alt s" id="pca" type="button">Применить</button></div><div id="pci" class="muted sm"></div><label class="l">К оплате деньгами, ₽</label><input id="pm" type="number" value="${dtot}"><label class="l">Способ оплаты</label><select id="pt"><option value="card">Карта (терминал)</option><option value="cash">Наличные</option><option value="sbp">СБП</option><option value="acct">На расчётный счёт</option></select>

  <div class="row"><button class="btn alt" data-act="close">Отмена</button><button class="btn ok" id="pok">Принять и пробить чек</button></div>`);
  const bn=m.querySelector("#pbn");if(bn)bn.oninput=()=>{const v=Math.max(0,Math.min(maxB,Math.round(+bn.value||0)));m.querySelector("#pm").value=Math.max(0,dtot-v-cu)};
  m.querySelector("#pca").onclick=()=>{const code=m.querySelector("#pcc").value.trim(),c=CERTS.find(x=>x.code===code&&x.bal>0),info=m.querySelector("#pci");if(!c){cc=null;cu=0;info.textContent=code?"Код не найден или баланс исчерпан":"";info.className="muted sm neg"}else{cc=c;const v=bn?Math.max(0,Math.min(maxB,Math.round(+bn.value||0))):0;cu=Math.min(c.bal,Math.max(0,dtot-v));info.className="muted sm pos";info.textContent="Списано с "+(c.kind==="abon"?"абонемента":"сертификата")+": "+rub(cu)+" (останется "+rub(c.bal-cu)+")"}m.querySelector("#pm").value=Math.max(0,dtot-(bn?Math.max(0,Math.min(maxB,Math.round(+bn.value||0))):0)-cu)};

  for(let d=1;d<=n;d++){const ds=`${ym}-${pad(d)}`,c=B.filter(b=>b.master===me.id&&b.date===ds&&b.status!=="cancelled").length,sel=ds===S.date;
    cells+=`<div data-act="mday" data-d="${ds}" style="text-align:center;padding:7px 0;border-radius:10px;cursor:pointer;border:1px solid ${ds===TODAY?"var(--blue)":c?(ds<TODAY?"#1f8a5b66":"#b8432f66"):"var(--line)"};background:${sel?"var(--accent)":c?(ds<TODAY?"#1f8a5b24":"#b8432f24"):"var(--card)"};color:${sel?"#fff":"inherit"};font-weight:${c?700:400}">${d}<div style="font-size:10px;line-height:1;min-height:10px">${c||""}</div></div>`};cells+=calTrail(Y,M,first,n)
  return `<div class="card"><div class="row" style="margin-bottom:8px"><button class="btn alt s" data-act="mmon" data-n="-1">←</button><b>${MONN[M-1]} ${Y}</b><div class="row gap"><button class="btn alt s" data-act="mtoday">Сегодня</button><button class="btn alt s" data-act="mmon" data-n="1">→</button></div></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div><div class="muted sm" style="margin-top:6px">Подсвечены дни, где у вас есть записи (цифра — сколько). Красные впереди, зелёные прошедшие. Нажмите на день — ниже кто и на какое время.</div></div>`}
function earRange(k){if(k==="week"){const m=mondayOf(S.date);return{from:m,to:addDays(m,6),label:"неделя"}}if(k==="cur")return{from:TODAY.slice(0,8)+"01",to:TODAY,label:"месяц"};if(k==="prev"){const e=addDays(TODAY.slice(0,8)+"01",-1);return{from:e.slice(0,8)+"01",to:e,label:"прошлый месяц"}}return{from:S.date,to:S.date,label:S.date===TODAY?"сегодня":dLong(S.date)}}
function earBlock(me){const k=S.mper||"day",rg=earRange(k),x=calc({from:rg.from,to:rg.to,label:rg.label}).pm.find(z=>z.m.id===me.id);
  const chip=(v,t)=>`<div class="chip ${k===v?"on":""}" data-act="mper" data-k="${v}">${t}</div>`;
  return `<div class="chips" style="margin-bottom:6px">${chip("day","День")}${chip("week","Неделя")}${chip("cur","Месяц")}${chip("prev","Прошлый месяц")}</div>
  <div class="ear"><div><div class="muted sm">Заработано · ${esc(rg.label)}</div><div class="k">${rub(x.sal)}</div></div><div><div class="muted sm">${k==="cur"||k==="prev"?"К выплате":"Уже выплачено в периоде"}</div><div class="k">${rub(k==="cur"||k==="prev"?x.bal:x.paid)}</div><div class="muted sm">★ ${mRating(me)}</div></div></div>
  <div class="card sm">${kv("Визитов",x.visits)}${kv("Выручка по вашим услугам",rub(x.sv))}${kv("С услуг ("+me.percent+"%)",rub(x.pct))}${kv("Чаевые",rub(x.tips))}${x.extra?kv("Ставка и премии",rub(x.extra)):""}${kv("Выплачено",rub(x.paid))}<div style="margin-top:6px"><button class="btn alt s" data-act="stmt" data-id="${me.id}" data-k="${k}">📄 Ведомость по дням</button></div></div>`}
function vMaster(){
  const me=mById(S.sess.master),mine=B.filter(b=>b.master===me.id&&b.date===S.date&&b.status!=="cancelled").sort((a,b)=>a.start<b.start?-1:1);

  ${BLOCKS.filter(x=>x.master===me.id&&x.date===S.date).map(x=>`<div class="card row" style="border-style:dashed"><div>🔒 <b>${esc(x.title)}</b> <span class="muted">${x.from}–${x.to}</span></div><button class="btn alt s" data-act="blkdel" data-id="${x.id}">Снять</button></div>`).join("")}
  <h2>${S.date===TODAY?"Сегодня":dLong(S.date)}: ${mine.length?mine.length+" "+(mine.length<5?"записи":"записей"):"записей нет"}</h2>
  ${mine.map(b=>`<div class="card" data-act="bk" data-id="${b.id}" style="cursor:pointer"><div class="row"><b style="font-size:19px">${b.start}–${hm(tm(b.start)+b.dur)}</b>${b.arrived&&["new","confirmed"].includes(b.status)?`<span class="tag arr">✔ пришёл</span>`:tag(b.status)}</div><div><b>${esc(cById(b.client).name)}</b>${firstVisit(b)?` <span class="tag fresh">новый</span>`:""} · ${esc(svName(b))}</div>${b.note||cById(b.client).note?`<div class="muted">📝 ${esc(b.note||cById(b.client).note)}</div>`:""}<div class="muted sm" style="margin-top:4px">${usageOf(b.id).length?"🧴 материалы списаны":"нажмите — списать расходники"}</div></div>`).join("")||`<div class="card muted" style="text-align:center;padding:26px">На этот день у вас нет записей 🎉</div>`}`}
/* ===== клиенты (администратор) ===== */
const lastDone=cid=>B.filter(b=>b.client===cid&&b.status==="done").map(b=>b.date).sort().pop()||"";
const noshows=cid=>B.filter(b=>b.client===cid&&b.status==="noshow").length;
const daysAgo=d=>Math.round((new Date(TODAY+"T12:00:00")-new Date(d+"T12:00:00"))/864e5);
const upcoming=cid=>B.some(b=>b.client===cid&&b.date>=TODAY&&["new","confirmed"].includes(b.status));
const lapsedList=()=>CLIENTS.filter(c=>{const l=lastDone(c.id);return l&&daysAgo(l)>=30&&!upcoming(c.id)}).sort((a,b)=>lastDone(a.id)<lastDone(b.id)?-1:1);

    <label class="l">Категория</label><select id="cc">${CCAT.map(x=>`<option ${v("cat")===x?"selected":""} value="${x}">${x||"—"}</option>`).join("")}</select>

    <label class="l">Дата рождения</label><input id="cb" type="date" value="${esc(v("bd"))}"><label class="l">Заметка</label><input id="cnote" value="${esc(v("note"))}">

      const dup=CLIENTS.find(x=>digits(x.phone)===ph.slice(-10)&&(!c||x.id!==c.id));if(dup){m.querySelector("#cerr").textContent="Такой телефон уже у клиента: "+dup.name;return}
      const o=c||{id:nid(),bonus:0};Object.assign(o,{name:nm,phone:"7"+ph.slice(-10),phone2:g("#cp2"),email:g("#ce"),cat:g("#cc"),sex:g("#cs"),disc:Math.max(0,Math.min(100,Math.round(+g("#cd")||0))),card:g("#ck"),bd:g("#cb"),note:g("#cnote"),noOnline:m.querySelector("#cno").checked});
      if(!c)CLIENTS.push(o);m.remove();render();toast("✓ Клиент сохранён")}}
  else if(tab==="hist")body.innerHTML=bs.map(b=>`<div class="card row" data-act="bk" data-id="${b.id}" style="cursor:pointer"><div><b>${dLong(b.date)}, ${b.start}</b><div class="muted sm">${esc(svName(b))} · ${esc(mById(b.master).name)}</div></div><div style="text-align:right"><b>${rub(total(b))}</b><div>${tag(b.status)}</div></div></div>`).join("")||'<div class="muted">Визитов нет</div>';
  else if(tab==="stat"){const paid=done.reduce((a,b)=>a+(b.paid?b.paid.amount:0),0),cnt=(k,f)=>{const o={};done.forEach(b=>{const n=f(b);o[n]=(o[n]||0)+1});const e=Object.entries(o).sort((a,b)=>b[1]-a[1])[0];return e?e[0]+" ("+e[1]+")":"—"};

  else if(tab==="loy")body.innerHTML=`<div class="card">${kv("Бонусов на счёте",c.bonus)}${kv("Личная скидка",(c.disc||0)+"%")}${kv("Категория",c.cat||"—")}</div><div class="muted sm">За каждый оплаченный визит начисляется 5% бонусами. Бонусами можно оплатить до 50% чека (1 балл = 1 ₽). Личная скидка подставляется в сумму при оплате.</div>`;

function vClients(){const lp=lapsedList().length;return `<div class="chips"><div class="chip ${!["lapsed","new","rep"].includes(S.cf)?"on":""}" data-act="cf" data-f="all">Все (${CLIENTS.length})</div><div class="chip ${S.cf==="lapsed"?"on":""}" data-act="cf" data-f="lapsed">Давно не были (${lp})</div><div class="chip ${S.cf==="new"?"on":""}" data-act="cf" data-f="new">Новые</div><div class="chip ${S.cf==="rep"?"on":""}" data-act="cf" data-f="rep">Повторные</div><div class="chip" data-act="impc">⬆ Импорт клиентов</div><div class="chip" data-act="cnew">＋ Новый клиент</div></div>${S.cf==="lapsed"?`<div class="note" style="margin-top:0">Клиенты, у которых последний визит был 30+ дней назад и нет будущей записи. Нажмите «Написать» — текст уже готов.</div>`:""}<input id="cq" data-in="cq" placeholder="Поиск: телефон, имя, «блонд», «борода»…" value="${esc(S.q)}"><div id="cl">${clList()}</div>`}
function clList(){const q=S.q.toLowerCase().trim(),pd=digits(S.q);
  let list=CLIENTS.map(c=>{const bs=B.filter(b=>b.client===c.id&&b.status!=="cancelled").sort((a,b)=>a.date<b.date?1:-1);return{c,bs}});
  if(S.cf==="lapsed"){const ids=new Set(lapsedList().map(c=>c.id));list=list.filter(x=>ids.has(x.c.id)).sort((a,b)=>lastDone(a.c.id)<lastDone(b.c.id)?-1:1)}
  if(S.cf==="new")list=list.filter(x=>{const d=B.filter(b=>b.client===x.c.id&&b.status==="done");return d.length<=1&&(d.length?daysAgo(d[0].date)<=30:x.bs.length>0)});

  if(q)list=list.filter(({c,bs})=>q.split(/\s+/).every(t=>(c.name+" "+c.note+" "+bs.map(b=>svName(b)+" "+b.note).join(" ")).toLowerCase().includes(t)||(pd.length>=3&&(digits(c.phone).includes(pd)||clientNo(c.id).includes(S.q.replace(/\D/g,""))))));

  <details class="card"><summary><b>Как это работает</b></summary><div class="sm" style="line-height:1.6">• Остаток хранится в граммах и миллилитрах, а не в тюбиках. Открыли тюбик, ушло 7 г — списали 7 г.<br>• <b>Приход</b>: сколько упаковок и по какой цене. Средняя цена грамма пересчитывается сама.<br>• <b>Расход</b>: мастер или администратор отмечает граммы прямо в записи клиента. Можно «по норме» одной кнопкой, можно вписать факт.<br>• Если ушло больше нормы на 20% — подсветка «перерасход».<br>• <b>Инвентаризация</b>: пересчитали руками — программа запишет разницу как излишек или потерю.<br>• Когда остаток ниже минимума — «мало» и список «что докупить».<br>• Владелец видит себестоимость каждого визита и маржу; администратор и мастера цен не видят.</div></details>`}

      const st=stockOf(mt.id);mt.cost=(Math.max(st,0)*mt.cost+qty*pp/mt.pack)/(Math.max(st,0)+qty);mt.packPrice=Math.round(mt.cost*mt.pack);

  if(kind==="inv"){const m=modal(`<h2 style="margin-top:0">Инвентаризация</h2><div class="muted">Впишите, сколько реально осталось. Разница спишется как излишек или потеря.</div><div style="margin-top:8px">${MATS.map(x=>`<label class="l">${esc(x.name)} (по программе ${Math.round(stockOf(x.id))} ${x.unit})</label><input type="number" data-m="${x.id}" value="${Math.round(stockOf(x.id))}">`).join("")}</div><div class="row"><button class="btn alt" data-act="close">Отмена</button><button class="btn ok" id="vok">Применить</button></div>`);

function perBar(p){return `<div class="row gap" style="margin-bottom:8px"><button class="btn ${p==="cur"?"":"alt"} s" data-act="per" data-p="cur">Этот месяц</button><button class="btn ${p==="prev"?"":"alt"} s" data-act="per" data-p="prev">Прошлый месяц</button><span class="muted">${period(p).label}</span></div>`}

function qualityBlock(p){const {from,to}=period(p),inR=d=>d>=from&&d<=to,live=B.filter(b=>inR(b.date));
  const dn=live.filter(b=>b.status==="done"),ns=live.filter(b=>b.status==="noshow"),rep=dn.filter(b=>B.some(x=>x.client===b.client&&x.id!==b.id&&x.status==="done"&&x.date<b.date)).length;
  const rv=B.filter(b=>b.review&&inR(b.date)),avg=rv.length?rv.reduce((a,b)=>a+b.review.r,0)/rv.length:0;
  const load=MASTERS.filter(m=>m.active).map(m=>{const mine=live.filter(b=>b.master===m.id&&["done","confirmed","new"].includes(b.status)),days=new Set(mine.map(b=>b.date)).size,mins=mine.reduce((a,b)=>a+b.dur,0),pc=days?Math.min(100,Math.round(mins/(days*(CLOSE-OPEN)*60)*100)):0;return{m,pc,days}});
  return `<h2>Качество и загрузка</h2><div class="grid"><div class="card"><div class="muted">Неявки</div><div class="k ${ns.length&&ns.length/(dn.length+ns.length)>.1?"neg":""}">${dn.length+ns.length?Math.round(ns.length/(dn.length+ns.length)*100):0}%</div><div class="muted sm">${ns.length} из ${dn.length+ns.length}</div></div><div class="card"><div class="muted">Повторные визиты</div><div class="k">${dn.length?Math.round(rep/dn.length*100):0}%</div><div class="muted sm">клиент уже бывал</div></div><div class="card"><div class="muted">Оценка клиентов</div><div class="k">${rv.length?"★ "+avg.toFixed(1):"—"}</div><div class="muted sm">отзывов: ${rv.length}</div></div><div class="card"><div class="muted">Новых клиентов</div><div class="k">${new Set(dn.filter(b=>firstVisit(b)).map(b=>b.client)).size}</div></div></div>
  <div class="card"><b>Загрузка мастеров</b><div class="muted sm" style="margin-bottom:6px">доля занятого времени в рабочие дни (с записями)</div>${load.map(x=>`<div style="margin-bottom:8px"><div class="row sm"><span>${esc(x.m.name)} <span class="muted">· ${x.days} раб. дн.</span></span><b>${x.pc}%</b></div><div class="bar ${x.pc<35?"low":""}"><i style="width:${x.pc}%"></i></div></div>`).join("")}<div class="muted sm">Красная полоса — мастер загружен меньше чем на треть: есть время для акций и записи новых клиентов.</div></div>
  ${rv.length?`<div class="card"><b>Последние отзывы</b>${rv.sort((a,b)=>a.review.date<b.review.date?1:-1).slice(0,5).map(b=>`<div class="rv ${b.review.r<=3?"low":""}" style="padding:4px 0 4px 8px;margin-top:6px"><div class="row sm"><b>${"★".repeat(b.review.r)}${"☆".repeat(5-b.review.r)}</b><span class="muted">${esc(mById(b.master).name)} · ${esc(cById(b.client).name.split(" ")[0])}</span></div>${b.review.t?`<div class="sm">${esc(b.review.t)}</div>`:""}</div>`).join("")}</div>`:""}`}
function vSummary(){const r=calc(S.period),days=[];for(let d=r.from;d<=r.to;d=addDays(d,1))days.push(d);const mx=Math.max(1,...days.map(d=>r.byDay[d]||0));
  const over=calc("prev").pm.filter(x=>x.over>0),low=MATS.filter(m=>stockOf(m.id)<m.min);
  return `${perBar(S.period)}${over.length?`<div class="note" style="border-color:#c0392b66;background:#c0392b14">⏰ Просрочена выплата ЗП за прошлый месяц: ${over.map(x=>esc(x.m.name)+" — "+rub(x.bal)+" ("+x.over+" дн.)").join("; ")}. <a href="#" data-act="tab" data-t="pay">Открыть</a></div>`:""}${low.length?`<div class="note">🧴 Мало на складе: ${low.map(m=>esc(m.name)).join(", ")}. <a href="#" data-act="tab" data-t="st">Склад</a></div>`:""}

function payHist(r){const l=EXP.filter(e=>e.cat==="salary"&&e.date>=r.from&&e.date<=r.to).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id);
  return `<h2>Выплаты за период (${l.length})</h2>${l.map(e=>{const m=mById(e.master);return `<div class="card row"><div><b>${esc(m?m.name:"—")}</b> · ${rub(e.amount)} ${e.note?`<span class="tag ${e.note==="Аванс"?"warn":"ok"}">${esc(e.note)}</span>`:""}<div class="muted sm">${e.date.split("-").reverse().join(".")}</div></div><button class="btn alt s" data-act="payundo" data-id="${e.id}">✕ Отменить выплату</button></div>`}).join("")||"<div class='card muted'>Выплат в этом периоде не было</div>"}<div class="muted sm" style="margin:-2px 0 8px">Выплатили не тому или не ту сумму? Отмените выплату — остаток у мастера вернётся, и можно провести заново.</div>`}
function actToast(t,label,fn,ms=8000){document.querySelectorAll(".toast").forEach(x=>x.remove());const e=document.createElement("div");e.className="toast ut";e.textContent=t;const b=document.createElement("button");b.className="ub";b.textContent=label;b.onclick=()=>{e.remove();fn()};e.appendChild(b);document.body.appendChild(e);setTimeout(()=>e.remove(),ms)}

  return `${perBar(S.period)}<div class="card row"><span>Отчётная дата выплаты ЗП за период</span><b>${r.pm[0]?r.pm[0].due.split("-").reverse().join("."):"—"}</b></div>

const ADJP=[["Премия за результат",1000],["Премия за отзыв",300],["Штраф за опоздание",-500],["Штраф за брак",-1000],["Удержание за материалы",-300]];
function schemesCard(){return `<h2>Схемы зарплаты</h2><div class="card">${SCHEMES.map(z=>`<div class="row" style="margin-bottom:6px"><div><b>${esc(z.name)}</b><div class="muted sm">${z.pct}% с услуг${z.rate?` + ${rub(z.rate)} за рабочий день`:""} · мастеров: ${MASTERS.filter(m=>m.scheme===z.id).map(m=>esc(m.name)).join(", ")||"—"}</div></div><button class="btn alt s" data-act="schedit" data-id="${z.id}">✎</button></div>`).join("")}

function schemeModal(id){const z=id?SCHEMES.find(x=>x.id===id):null;

  const q=i=>m.querySelector(i);q("#zok").onclick=()=>{const n=q("#zn").value.trim();if(!n){q("#zer").textContent="Введите название";return}

function adjModal(mid){const mm=mById(mid),m=modal(`<h2 style="margin-top:0">Премия / штраф · ${esc(mm.name)}</h2><div class="chips">${ADJP.map((p,i)=>`<div class="chip" data-i="${i}">${p[0]} ${p[1]>0?"+":""}${p[1]}</div>`).join("")}</div>

  const cap=MASTERS.filter(m=>m.active).map(m=>{const avail=days.reduce((a,d)=>a+(CLOSE-OPEN)*60-BLOCKS.filter(x=>x.master===m.id&&x.date===d).reduce((t,x)=>t+tm(x.to)-tm(x.from),0),0),used=live.filter(b=>b.master===m.id&&b.date<=end&&b.status!=="noshow").reduce((a,b)=>a+b.dur,0);return{m,p:pct(used,avail),used,avail}});

  const ids=new Set(done.map(b=>b.client)),isNew=c=>!B.some(x=>x.client===c&&x.status==="done"&&x.date<from),newC=[...ids].filter(isNew).length,repC=ids.size-newC;

  <h2>Клиенты</h2><div class="grid"><div class="card"><div class="muted">Новые</div><div class="k">${newC}</div></div><div class="card"><div class="muted">Повторные</div><div class="k">${repC}</div></div><div class="card"><div class="muted">Потерянные (60+ дн.)</div><div class="k">${lost}</div></div></div>
  <h2>Откуда записи</h2><div class="card">${Object.entries(src).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v} · ${pct(v,bs.length)}%</b></div>${bar(pct(v,bs.length),"var(--blue)")}`).join("")||"Нет данных"}</div>
  <h2>Товары, сертификаты, предоплаты</h2><div class="card">${(()=>{const gp=PAY.filter(x=>x.kind==="goods"&&inR(x.date));return kv("Продажи товаров",rub(gp.reduce((a,x)=>a+x.amount,0))+" · "+gp.length+" чеков")+kv("Сертификаты и абонементы: не использовано",rub(CERTS.reduce((a,c)=>a+c.bal,0)))+kv("Предоплаты ждут визита",rub(B.filter(b=>b.prepay&&!b.prepay.used&&b.status!=="cancelled"&&b.status!=="done").reduce((a,b)=>a+b.prepay.amount,0)))+kv("Акций идёт сейчас",PROMOS.filter(p=>promoOn(p,TODAY)).length)})()}</div>

/* ===== импорт прайс-листа из Excel / CSV ===== */
function svGuess(h){const t=String(h||"").toLowerCase();if(/раздел|катег|групп/.test(t))return"cat";if(/назван|услуг|наимен/.test(t))return"name";if(/цен|стоим|руб/.test(t))return"price";if(/длит|врем|мин/.test(t))return"dur";if(/показ|онлайн|скры/.test(t))return"show";return"skip"}
function svPlan(rows,hdr){const map=hdr?rows[0].map(svGuess):["cat","name","price","dur","show"],body=hdr?rows.slice(1):rows,add=[],upd=[],bad=[];
  body.forEach((r,n)=>{const g=k=>{const i=map.indexOf(k);return i<0?"":String(r[i]==null?"":r[i]).trim()};const name=g("name"),cat=g("cat")||"Прочее",price=Math.round(parseFloat(g("price").replace(/\s/g,"").replace(",","."))),dr=parseInt(g("dur"))||60,dur=Math.max(30,Math.min(240,Math.ceil(dr/30)*30)),sh=g("show").toLowerCase(),off=/^(нет|no|0|скры|н)/.test(sh)?1:0;
    if(!name||!(price>0)){bad.push((hdr?n+2:n+1)+": "+(name||"без названия")+" — нет цены");return}
    const ex=SERVICES.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.cat.toLowerCase()===cat.toLowerCase());
    if(ex)upd.push({ex,price,dur,off,cat,name});else if(!add.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.cat.toLowerCase()===cat.toLowerCase()))add.push({cat,name,price,dur,off})});
  return{add,upd,bad}}
function svImport(){let plan=null;
  const m=modal(`<h2 style="margin-top:0">Загрузка прайс-листа</h2><div class="muted sm">Файл Excel (.xlsx) или CSV с колонками: <b>Раздел, Название, Цена, Длительность (мин), Показывать клиентам (да/нет)</b>. Услуга с тем же названием в том же разделе обновится, остальные добавятся. Ничего не удаляется.</div>
  <div class="row gap wrap" style="justify-content:flex-start;margin:8px 0"><button class="btn alt s" id="vtpl">⬇ Образец (CSV)</button></div>
  <input type="file" id="vfile" accept=".xlsx,.csv,.txt,.tsv"><div class="muted sm" style="margin:6px 0">или вставьте таблицу из Excel:</div><textarea id="vpaste" rows="4" style="width:100%" placeholder="Раздел  Название  Цена  Минут"></textarea>
  <div id="verr" class="neg"></div><div id="vprev"></div><div class="row"><button class="btn alt" data-act="close">Отмена</button><button class="btn" id="vnext">Проверить</button></div>`);
  const err=t=>m.querySelector("#verr").textContent=t,prev=m.querySelector("#vprev"),nb=m.querySelector("#vnext");
  const show=rows=>{if(!rows||!rows.length)return err("В файле нет данных");const hdr=/назван|услуг|цен|раздел/i.test(rows[0].join(" "));plan=svPlan(rows,hdr);
    prev.innerHTML=`<div class="card"><b>Добавится: ${plan.add.length} · обновится: ${plan.upd.length}${plan.bad.length?" · пропущено: "+plan.bad.length:""}</b>${plan.add.slice(0,6).map(x=>`<div class="sm">+ ${esc(x.cat)} · ${esc(x.name)} — ${rub(x.price)}, ${x.dur} мин</div>`).join("")}${plan.upd.slice(0,4).map(x=>`<div class="sm">↻ ${esc(x.name)}: ${rub(x.ex.price)} → ${rub(x.price)}</div>`).join("")}${plan.bad.slice(0,4).map(x=>`<div class="sm neg">${esc(x)}</div>`).join("")}</div>`;
    nb.textContent="Загрузить";nb.dataset.go=1;err("")};
  m.querySelector("#vtpl").onclick=()=>{const t="﻿Раздел;Название;Цена;Длительность (мин);Показывать клиентам\r\n"+SERVICES.map(x=>[x.cat,x.name,x.price,x.dur,x.off?"нет":"да"].join(";")).join("\r\n")+"\r\n",a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="obrazec_prajs.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
  m.querySelector("#vfile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const buf=await f.arrayBuffer();let rows;if(/\.xlsx$/i.test(f.name)||new Uint8Array(buf.slice(0,2)).join()==="80,75"){if(typeof DecompressionStream==="undefined")return err("Этот браузер не читает .xlsx — сохраните как CSV или вставьте таблицу");rows=await readXlsx(buf)}else rows=parseDelim(decodeText(buf));show(rows)}catch(x){err("Не удалось прочитать файл")}};
  nb.onclick=()=>{if(nb.dataset.go&&plan){plan.upd.forEach(x=>{x.ex.price=x.price;x.ex.dur=x.dur;x.ex.off=x.off});plan.add.forEach(x=>SERVICES.push({id:nid(),cat:x.cat,name:x.name,price:x.price,dur:x.dur,off:x.off}));const n=plan.add.length,u=plan.upd.length;m.remove();render();toast("Прайс загружен: добавлено "+n+", обновлено "+u);return}
    const t=m.querySelector("#vpaste").value;if(!t.trim())return err("Выберите файл или вставьте таблицу");show(parseDelim(t))}}

/* ===== касса: режим «Демо» или «АТОЛ» (локальный веб-сервер кассы на компьютере администратора) ===== */
const KTAX={usn_income:"УСН доходы",usn_income_outcome:"УСН доходы минус расходы",patent:"Патент",osn:"ОСН",envd:"ЕНВД",esn:"ЕСХН"};
const KVAT={none:"Без НДС",vat0:"НДС 0%",vat5:"НДС 5%",vat7:"НДС 7%",vat10:"НДС 10%",vat20:"НДС 20%",vat22:"НДС 22%"};
const kcfg=()=>Object.assign({mode:"demo",url:"http://127.0.0.1:16732",tax:"usn_income",vat:"none",operator:""},CFG.kassa||{});
function kassaSet(k,v){CFG.kassa=Object.assign(kcfg(),{[k]:v})}
const kuuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"k"+Date.now()+Math.random().toString(16).slice(2);
const KSIM=(()=>{let o={open:0,shift:0,doc:0};try{o=Object.assign(o,JSON.parse(localStorage.getItem("ksim")||"{}"))}catch(e){}return o})();
const ksimSave=()=>{try{localStorage.setItem("ksim",JSON.stringify(KSIM))}catch(e){}};
async function ksimCall(task){await new Promise(z=>setTimeout(z,900));const r=task.request||{},t=r.type,names=(r.items||[]).map(i=>i.name).join(" ");
  if(t==="openShift"){if(KSIM.open)return{ok:false,error:"Смена уже открыта"};KSIM.open=1;KSIM.shift++;ksimSave();return{ok:true,res:{shiftNumber:KSIM.shift}}}
  if(t==="closeShift"){if(!KSIM.open)return{ok:false,error:"Смена уже закрыта"};KSIM.open=0;ksimSave();return{ok:true,res:{shiftNumber:KSIM.shift}}}
  if(!KSIM.open)return{ok:false,error:"Смена закрыта: откройте смену на кассе (Настройки → Касса → «Открыть смену на кассе»)"};
  if(/БУМАГА/.test(names))return{ok:false,error:"Нет бумаги в принтере"};
  if(/ОШИБКА/.test(names))return{ok:false,error:"Ошибка кассы (проверка)"};
  KSIM.doc++;ksimSave();const n=1000+KSIM.doc;
  return{ok:true,res:{fiscalParams:{fiscalDocumentNumber:n,fiscalDocumentSign:String(2000000000+Math.floor(Math.random()*999999999)),shiftNumber:KSIM.shift}}}}
async function kassaCall(task){if(kcfg().mode==="sim")return ksimCall(task);const k=kcfg(),base=String(k.url||"").replace(/\/+$/,"");let r;
  try{r=await fetch(base+"/requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(task)})}
  catch(e){return{ok:false,error:"Нет связи с кассой ("+base+"). Запущена ли программа кассы на этом компьютере и разрешён ли доступ из браузера?"}}
  if(!r.ok)return{ok:false,error:"Касса ответила ошибкой "+r.status};
  let id;try{id=(await r.json()).uuid||task.uuid}catch(e){id=task.uuid}
  for(let i=0;i<40;i++){await new Promise(z=>setTimeout(z,500));let s;try{s=await(await fetch(base+"/requests/"+id)).json()}catch(e){continue}
    if(s.status==="ready")return{ok:true,res:s.result||{}};if(s.status==="error")return{ok:false,error:(s.error&&s.error.description)||"Ошибка кассы"}}
  return{ok:false,error:"Касса не ответила за 20 секунд"}}
function kassaTask(items,amount,method){const k=kcfg(),sum=items.reduce((a,x)=>a+x.p,0)||1;let left=Math.round(amount*100);
  const pos=items.map((x,i)=>{const a=i===items.length-1?left:Math.round(amount*100*x.p/sum);left-=a;const v=a/100;
    return{type:"position",name:String(x.n).slice(0,128),price:v,quantity:1,amount:v,paymentMethod:"fullPayment",paymentObject:"service",tax:{type:k.vat}}});
  return{uuid:kuuid(),request:{type:"sell",operator:{name:k.operator||actor()},taxationType:k.tax,items:pos,payments:[{type:method==="cash"?"cash":"electronically",sum:Math.round(amount*100)/100}]}}}
async function kassaSell(items,amount,method){const r=await kassaCall(kassaTask(items,amount,method));if(!r.ok)return r;
  const f=(r.res&&r.res.fiscalParams)||{};if(!f.fiscalDocumentNumber)return{ok:false,error:"Касса не вернула номер чека"};
  return{ok:true,doc:f.fiscalDocumentNumber,fp:String(f.fiscalDocumentSign||""),shift:f.shiftNumber}}
const _rm0=receiptModal;

A.refiscal=function(el){const b=B.find(x=>x.id===+el.dataset.id);if(!b||!b.paid)return;closeModal();const p=b.paid;kassaRun(b,p.kitems||[{n:svName(b),p:p.kamount||p.amount}],p.kamount||p.amount,p.kmethod||p.method,p.bonusUsed||0)};

function kassaCard(){const k=kcfg(),opt=(o,v)=>Object.entries(o).map(([a,b])=>`<option value="${a}" ${v===a?"selected":""}>${b}</option>`).join("");

  <label class="l">Режим</label><select onchange="kassaSet('mode',this.value);render()"><option value="demo" ${k.mode==="demo"?"selected":""}>Демо (без кассы)</option><option value="sim" ${k.mode==="sim"?"selected":""}>АТОЛ — имитация (показать, как это работает)</option><option value="atol" ${k.mode==="atol"?"selected":""}>АТОЛ (боевой)</option></select>
  ${k.mode==="sim"?`<div class="note" style="margin:8px 0 0"><b>Имитация.</b> Программа ведёт себя так же, как с настоящей кассой АТОЛ: нужно открыть смену, чек получает номер ФД и фискальный признак, возможны ошибки. Но ничего не печатается и никуда не отправляется. Чтобы проверить ошибку, добавьте к услуге доплату со словом БУМАГА или ОШИБКА.</div><div class="row gap" style="margin-top:8px"><button class="btn alt s" data-act="kshift" data-v="open">Открыть смену на кассе</button><button class="btn alt s" data-act="kshift" data-v="close">Закрыть смену на кассе</button></div>`:""}${k.mode==="atol"?`<label class="l">Адрес веб-сервера кассы</label><input value="${esc(k.url)}" onchange="kassaSet('url',this.value.trim())">

  <div class="muted sm" style="margin-top:6px">Чек пробивается для оплат наличными, картой и СБП. Предоплаты, сертификаты и баллы оформляйте по правилам вашего бухгалтера: чек пробивается на сумму, оплаченную деньгами.</div>`:""}</div>`}

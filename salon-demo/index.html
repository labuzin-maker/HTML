<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Парикмахерская — демо интерфейсов</title>
<style>
:root{--bg:#f5f2ee;--ink:#1d1a17;--muted:#6c655e;--card:#fff;--line:#e6dfd5;--accent:#b8432f;--ok:#1f8a5b;--blue:#2f66b3;--warn:#c98a12;--bad:#c0392b;--row:44px}
@media (prefers-color-scheme:dark){:root{--bg:#141110;--ink:#f4ede6;--muted:#a79d93;--card:#211c19;--line:#352d28}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.demo{position:sticky;top:0;z-index:50;display:flex;gap:6px;align-items:center;padding:8px 10px;background:#1d1a17;color:#fff;overflow-x:auto;white-space:nowrap}
.demo b{font-size:12px;opacity:.7;margin-right:4px}
.demo button{border:0;border-radius:99px;padding:7px 13px;background:#3a332e;color:#fff;font-size:14px}
.demo button.on{background:var(--accent)}
#app{max-width:1200px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:21px;margin:6px 0}h2{font-size:17px;margin:16px 0 8px}h3{font-size:15px;margin:10px 0 4px}
.muted{color:var(--muted);font-size:14px}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.gap{gap:8px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.blue{background:var(--blue)}.btn.s{padding:6px 10px;font-size:13px}.btn.full{width:100%}
.btn[disabled]{opacity:.4}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}
label.l{display:block;font-size:13px;color:var(--muted);margin:2px 0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:6px 0 10px}
.tabs button{border:0;background:none;padding:10px 11px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;font-weight:600}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--line);white-space:nowrap}
.tag.new{background:#f6e7c1;color:#7a5200}.tag.confirmed{background:#d5e4f7;color:#1c4a85}.tag.done{background:#cdeedd;color:#14603f}.tag.noshow{background:#f6d4cf;color:#8e2417}
.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:#cdeedd;color:#14603f}.tag.warn{background:#f6e7c1;color:#7a5200}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:15px}.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}.chip.off{opacity:.35;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}
.k{font-size:24px;font-weight:800}.neg{color:var(--bad)}.pos{color:var(--ok)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:80}
.sheet{background:var(--card);width:100%;max-width:580px;border-radius:18px 18px 0 0;padding:16px;max-height:92vh;overflow:auto}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:18px}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
table.t{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.t th,.t td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}.t th:first-child,.t td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:700}
.t th{font-size:12px;color:var(--muted);font-weight:600}.t tfoot td{font-weight:800;border-bottom:0}.t td.hl{background:rgba(184,67,47,.08);font-weight:700}
.t.lt th,.t.lt td{text-align:left}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}.bar.low i{background:var(--bad)}
/* журнал */
.jwrap{overflow:auto;max-height:calc(100vh - 230px);min-height:380px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.jr{display:grid;grid-template-columns:46px repeat(var(--n),minmax(150px,1fr));min-width:min-content}
.jh{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.jh .av{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:2px}
.jh small{color:var(--muted);font-size:11px;line-height:1.2}
.jcorner{left:0;z-index:6;border-left:0}
.jt{position:sticky;left:0;z-index:3;background:var(--card);height:calc(var(--rows)*var(--row))}
.jt span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.jc{position:relative;border-left:1px solid var(--line);height:calc(var(--rows)*var(--row));background-image:repeating-linear-gradient(#0000 0 calc(var(--row) - 1px),var(--line) calc(var(--row) - 1px) var(--row));cursor:cell}
.bk{position:absolute;left:3px;right:3px;border-radius:9px;padding:4px 7px;overflow:hidden;font-size:12px;line-height:1.25;cursor:pointer;border-left:4px solid;box-shadow:0 1px 2px #0002}
.bk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk.new{background:#fbefcf;border-color:var(--warn);color:#4d3500}.bk.confirmed{background:#dbe8f8;border-color:var(--blue);color:#143a6e}
.bk.done{background:#d3f0e1;border-color:var(--ok);color:#0f4d32}.bk.noshow{background:#f8dad6;border-color:var(--bad);color:#74180e}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:2;pointer-events:none}.now:before{content:"";position:absolute;left:-1px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* запись клиента */
.steps{display:flex;gap:4px;margin:6px 0 12px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--accent)}.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px #b8432f33}
.av2{width:44px;height:44px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}.day{flex:none;width:54px;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.day small{display:block;color:var(--muted);font-size:11px}.day b{font-size:17px}.day.on{background:var(--accent);color:#fff;border-color:var(--accent)}.day.on small{color:#fffc}.day.off{opacity:.4}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px;z-index:40}.sticky>div{max-width:1200px;margin:0 auto}
.ok-ring{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:34px;margin:10px auto}
.note{background:#c98a1214;border:1px solid #c98a1255;border-radius:12px;padding:10px;font-size:14px;margin:8px 0}
details>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
/* заставка */
#splash{position:fixed;inset:0;z-index:200;background:#17130f;color:#f6efe6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;cursor:pointer;animation:spOut .5s ease 2.35s forwards}
#splash svg{width:132px;height:132px;overflow:visible}
#splash .bl{transform-origin:60px 56px;animation:snip 1.5s cubic-bezier(.5,0,.2,1) .25s both}
#splash .bl.r{animation-name:snipR}
#splash .tip{fill:#d9573f}#splash svg *{stroke:#f6efe6}#splash .tip,#splash .fl{stroke:none}#splash .fl{fill:#f6efe6}
#splash .ring{fill:none;stroke-width:5}#splash .blade{fill:#f6efe6;stroke:none}
#splash .nm{font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1.1;animation:spUp .7s ease .9s both}
#splash .nm b{color:#d9573f}
#splash .sub{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:#b5aa9d;animation:spUp .7s ease 1.2s both}
#splash .ln{width:0;height:2px;background:#d9573f;animation:spLn .8s ease 1.1s forwards}
#splash .hint{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:#7d7368;animation:spUp .5s ease 1.6s both}
@keyframes snip{0%{transform:rotate(-26deg)}45%{transform:rotate(7deg)}65%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
@keyframes snipR{0%{transform:rotate(26deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(14deg)}100%{transform:rotate(0)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spLn{to{width:64px}}@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash,#splash *{animation-duration:.01s!important;animation-delay:0s!important}#splash{animation:spOut .3s ease 1.2s forwards!important}}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 1px}
</style>
</head>
<body>
<div class="demo" id="demo"><b>ДЕМО ВХОДА КАК:</b>
<button data-act="role" data-v="client">📱 Клиент</button><button data-act="role" data-v="master">💇 Мастер</button><button data-act="role" data-v="admin">🖥 Администратор</button><button data-act="role" data-v="owner">👑 Владелец</button>
<button data-act="reset" style="margin-left:auto;background:#5b2a22">↺ Сброс</button></div>
<div id="app"></div>
<script>
/* ===== утилиты ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const NOW=new Date(),TODAY=ymd(NOW),NOWMIN=NOW.getHours()*60+NOW.getMinutes();
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const tm=s=>+s.slice(0,2)*60+ +s.slice(3);
const hm=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const DOW=["вс","пн","вт","ср","чт","пт","сб"],MONG=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],MONN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const dLong=s=>{const d=new Date(s+"T12:00:00");return DOW[d.getDay()]+", "+d.getDate()+" "+MONG[d.getMonth()]};
const OPEN=10,CLOSE=20,ROW=44;
const ST={new:"Ожидает",confirmed:"Подтверждена",done:"Оплачена",noshow:"Не пришёл",cancelled:"Отмена"};
let seq=1000;const nid=()=>++seq;
let rs=20261028;const rnd=n=>{rs=(rs*1103515245+12345)&0x7fffffff;return (rs>>8)%n};

/* ===== справочники ===== */
let MASTERS,SERVICES,MATS,NORMS,CLIENTS,B,PAY,EXP,MOV,CFG,USERS;
function seed(){
  seq=1000;rs=20261028;
  CFG={payDay:5,name:"Парикмахерская #8",addr:"г. Владивосток, ул. Примерная, 1"};
  USERS={admin:{login:"admin",pass:"admin123",name:"Администратор"},owner:{login:"owner",pass:"owner123",name:"Владелец"}};
  MASTERS=[
    {id:1,name:"Анна",role:"Стилист-колорист",percent:40,login:"anna",pass:"anna123",color:"#b8432f",rating:4.9,active:1},
    {id:2,name:"Игорь",role:"Парикмахер",percent:40,login:"igor",pass:"igor123",color:"#2f66b3",rating:4.8,active:1},
    {id:3,name:"Марина",role:"Парикмахер",percent:35,login:"marina",pass:"marina123",color:"#7a4fa3",rating:5.0,active:1}];
  SERVICES=[
    {id:1,cat:"Стрижки",name:"Стрижка женская",price:900,dur:60},{id:2,cat:"Стрижки",name:"Стрижка мужская",price:600,dur:30},
    {id:3,cat:"Стрижки",name:"Стрижка детская",price:500,dur:30},{id:4,cat:"Стрижки",name:"Стрижка + укладка",price:1200,dur:60},
    {id:5,cat:"Уход",name:"Стрижка + уход",price:1300,dur:60},{id:6,cat:"Окрашивание",name:"Окрашивание + стрижка + уход",price:3300,dur:180},
    {id:7,cat:"Окрашивание",name:"Тонирование",price:1800,dur:90},{id:8,cat:"Борода",name:"Борода / оформление",price:300,dur:30}];
  MATS=[
    {id:1,name:"Краска 7/1 (пепельный блонд)",unit:"г",pack:60,packName:"тюбик",packPrice:280,min:120},
    {id:2,name:"Краска 9/0 (светлый блонд)",unit:"г",pack:60,packName:"тюбик",packPrice:280,min:120},
    {id:3,name:"Окислитель 6%",unit:"мл",pack:1000,packName:"флакон",packPrice:350,min:500},
    {id:4,name:"Маска для волос",unit:"г",pack:500,packName:"банка",packPrice:900,min:150},
    {id:5,name:"Шампунь профессиональный",unit:"мл",pack:1000,packName:"флакон",packPrice:600,min:300},
    {id:6,name:"Перчатки",unit:"шт",pack:100,packName:"упаковка",packPrice:250,min:20}];
  MATS.forEach(m=>m.cost=m.packPrice/m.pack);
  NORMS={6:[[1,60],[3,90],[6,2]],7:[[2,30],[3,45],[6,2]],5:[[4,20],[5,10]],1:[[5,10]],4:[[5,10]]};
  CLIENTS=[["Мария Иванова","79141000001","любит каре, аллергия на аммиак"],["Сергей Петров","79141000002",""],["Алексей Громов","79141000003","борода 3 мм"],["Ольга Смирнова","79141000004","окрашивание блонд, формула 7/1 + 6%"],["Дмитрий Орлов","79141000005",""],["Екатерина Волкова","79141000006","стрижка боб"],["Иван Козлов","79141000007","сын 7 лет — детская"],["Наталья Белова","79141000008","тонирование раз в 6 недель"]].map((c,i)=>({id:i+1,name:c[0],phone:c[1],note:c[2],bonus:0}));
  B=[];PAY=[];EXP=[];MOV=[];
  const addB=(date,master,start,sid,status,cid,extra={})=>{const sv=SERVICES.find(s=>s.id===sid);
    const b={id:nid(),date,master,start,dur:sv.dur,service:sid,client:cid,status,price:sv.price,extras:[],note:"",source:["app","phone","walkin","phone"][rnd(4)],...extra};B.push(b);return b};
  const settle=(b,withUse=true)=>{const m=MASTERS.find(x=>x.id===b.master),total=b.price+b.extras.reduce((a,x)=>a+x.a,0);
    const method=["card","cash","sbp"][rnd(3)];PAY.push({id:nid(),booking:b.id,date:b.date,amount:total,method,kind:"service",master:b.master,pct:m.percent});
    if(rnd(4)===0)PAY.push({id:nid(),booking:b.id,date:b.date,amount:100,method:"cash",kind:"tip",master:b.master,pct:0});
    b.paid={amount:total,method,fiscal:"№"+(1000+b.id)};
    CLIENTS.find(c=>c.id===b.client).bonus+=Math.round(total*0.05);
    if(withUse)(NORMS[b.service]||[]).forEach(([mid,q])=>{const k=0.85+rnd(40)/100;MOV.push({id:nid(),date:b.date,mat:mid,qty:-Math.round(q*k*(MATS.find(x=>x.id===mid).unit==="шт"?0+1/k:1)),type:"out",cost:MATS.find(x=>x.id===mid).cost,booking:b.id,master:b.master,note:""})})};
  const wsv=[1,1,2,2,2,3,4,4,5,6,7,8];
  for(let d=-45;d<=5;d++){const date=addDays(TODAY,d);
    if(d===0)continue;
    for(const m of MASTERS){if(m.id===3&&!(d%3===0))continue;
      let t=600+rnd(3)*30;const n=m.id===3?2:3+rnd(3);
      for(let i=0;i<n;i++){const sid=m.id===1&&rnd(3)===0?[6,7][rnd(2)]:wsv[rnd(wsv.length)],sv=SERVICES.find(s=>s.id===sid);
        if(t+sv.dur>1200)break;
        const st=d<0?(rnd(20)===0?"noshow":rnd(20)===0?"cancelled":"done"):(rnd(2)?"confirmed":"new");
        const b=addB(date,m.id,hm(t),sid,st,1+rnd(8));if(st==="done")settle(b,true);t+=sv.dur+rnd(3)*30}}}
  /* сегодня — вручную, чтобы журнал выглядел живым */
  [[1,"10:00",1,"done",1],[1,"11:30",6,"confirmed",4],[1,"15:00",7,"new",8],[2,"10:30",2,"done",2],[2,"12:00",2,"new",5],[2,"13:00",4,"confirmed",6],[2,"16:00",8,"new",3],[2,"17:00",2,"new",7]]
    .forEach(([mm,s,sid,st,cid])=>{const b=addB(TODAY,mm,s,sid,st,cid,{source:"phone"});if(st==="done")settle(b,true)});
  B.find(b=>b.date===TODAY&&b.service===6).note="окрашивание, как в прошлый раз, 7/1";
  /* расходы (не материалы) */
  const m0=TODAY.slice(0,8)+"01",pm=addDays(m0,-1).slice(0,8)+"01";
  [[m0,25000,"rent","Аренда"],[pm,25000,"rent","Аренда"],[addDays(m0,3),3000,"ads","Листовки"],[addDays(pm,4),3000,"ads","Реклама"],[addDays(m0,2),4200,"utilities","Коммуналка"],[addDays(pm,3),4200,"utilities","Коммуналка"]]
    .forEach(([date,amount,cat,note])=>EXP.push({id:nid(),date,amount,cat,note,master:0}));
  EXP.push({id:nid(),date:addDays(pm,35>28?28:28),amount:8000,cat:"salary",note:"Выплата",master:1});
  EXP.push({id:nid(),date:addDays(m0,2),amount:3000,cat:"salary",note:"Аванс",master:2});
  /* склад: остатки считаются из движений */
  const used={};MOV.filter(x=>x.type==="out").forEach(x=>used[x.mat]=(used[x.mat]||0)-x.qty);
  const target={1:300,2:100,3:1800,4:380,5:650,6:40},recent={3:[2000,-8],4:[500,-3],5:[1000,-6]};
  MATS.forEach(m=>{const r=recent[m.id];const open=Math.max(m.pack,(used[m.id]||0)+target[m.id]-(r?r[0]:0));
    MOV.push({id:nid(),date:addDays(TODAY,-46),mat:m.id,qty:open,type:"in",cost:m.cost,note:"Начальный остаток"});
    if(r)MOV.push({id:nid(),date:addDays(TODAY,r[1]),mat:m.id,qty:r[0],type:"in",cost:m.cost,note:"Поставка"})});
}
seed();
const stockOf=id=>MOV.filter(x=>x.mat===id).reduce((a,x)=>a+x.qty,0);
const matById=id=>MATS.find(m=>m.id===id),svById=id=>SERVICES.find(s=>s.id===id),mById=id=>MASTERS.find(m=>m.id===id),cById=id=>CLIENTS.find(c=>c.id===id);
const total=b=>b.price+b.extras.reduce((a,x)=>a+x.a,0);
const usageOf=bid=>MOV.filter(x=>x.booking===bid&&x.type==="out");
const usageCost=bid=>usageOf(bid).reduce((a,x)=>a-x.qty*x.cost,0);
const conflict=(date,mid,t,dur,ign)=>B.some(b=>b.id!==ign&&b.date===date&&b.master===mid&&b.status!=="cancelled"&&tm(b.start)<t+dur&&tm(b.start)+b.dur>t);
function freeTimes(date,master,dur,ign,anyTime){const ms=(master?[master]:MASTERS.filter(m=>m.active).map(m=>m.id)),out=[];
  for(let t=OPEN*60;t+dur<=CLOSE*60;t+=30){if(!anyTime&&date===TODAY&&t<NOWMIN+30)continue;if(!anyTime&&date<TODAY)continue;
    const free=ms.filter(mid=>!conflict(date,mid,t,dur,ign));if(free.length)out.push({t:hm(t),free})}return out}
function packsText(m,st){const full=Math.floor(st/m.pack),rest=Math.round((st-full*m.pack)*10)/10;
  return (full?full+" "+m.packName+(full>1&&full<5?"а":full>=5?"ов":"")+(rest?" + ":""):"")+(rest||!full?rest+" "+m.unit+(full?" вскрытого":""):"")}
/* ===== расчёт периода ===== */
function period(p){const m0=TODAY.slice(0,8)+"01";if(p==="prev"){const e=addDays(m0,-1);return{from:e.slice(0,8)+"01",to:e,label:MONN[+e.slice(5,7)-1]+" "+e.slice(0,4)}}return{from:m0,to:TODAY,label:MONN[+TODAY.slice(5,7)-1]+" "+TODAY.slice(0,4)}}
function calc(p){const {from,to}=period(p),inR=d=>d>=from&&d<=to;
  const pay=PAY.filter(x=>inR(x.date)),rev=pay.reduce((a,x)=>a+x.amount,0);
  const mats=MOV.filter(x=>x.type==="out"&&inR(x.date)).reduce((a,x)=>a-x.qty*x.cost,0)+MOV.filter(x=>x.type==="inv"&&inR(x.date)&&x.qty<0).reduce((a,x)=>a-x.qty*x.cost,0);
  const bought=MOV.filter(x=>x.type==="in"&&inR(x.date)&&x.note!=="Начальный остаток").reduce((a,x)=>a+x.qty*x.cost,0);
  const other=EXP.filter(e=>inR(e.date)&&e.cat!=="salary").reduce((a,e)=>a+e.amount,0);
  const pm=MASTERS.map(m=>{const mp=pay.filter(x=>x.master===m.id),sv=mp.filter(x=>x.kind==="service").reduce((a,x)=>a+x.amount,0),tips=mp.filter(x=>x.kind==="tip").reduce((a,x)=>a+x.amount,0);
    const pct=Math.round(mp.filter(x=>x.kind==="service").reduce((a,x)=>a+x.amount*x.pct,0)/100),paid=EXP.filter(e=>e.cat==="salary"&&e.master===m.id&&inR(e.date)).reduce((a,e)=>a+e.amount,0);
    const visits=new Set(mp.filter(x=>x.kind==="service").map(x=>x.booking)).size,mc=MOV.filter(x=>x.type==="out"&&inR(x.date)&&x.master===m.id).reduce((a,x)=>a-x.qty*x.cost,0);
    const [y,mo]=to.split("-").map(Number),due=`${mo===12?y+1:y}-${pad(mo===12?1:mo+1)}-${pad(CFG.payDay)}`,sal=pct+tips,bal=sal-paid;
    return{m,visits,sv,pct,tips,sal,paid,bal,mats:mc,due,over:bal>0&&TODAY>due?Math.round((new Date(TODAY)-new Date(due))/864e5):0}});
  const accrued=pm.reduce((a,x)=>a+x.sal,0);
  const byDay={};pay.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+x.amount);
  const bySvc={};pay.filter(x=>x.kind==="service").forEach(x=>{const b=B.find(z=>z.id===x.booking);if(!b)return;const n=svById(b.service).name;bySvc[n]=bySvc[n]||{n:0,s:0};bySvc[n].n++;bySvc[n].s+=x.amount});
  return{from,to,pay,rev,mats,bought,other,pm,accrued,profit:rev-mats-other-accrued,byDay,bySvc,visits:new Set(pay.filter(x=>x.kind==="service").map(x=>x.booking)).size}}

function vStock(){const ow=isOwner(),low=MATS.filter(m=>stockOf(m.id)<m.min),val=MATS.reduce((a,m)=>a+stockOf(m.id)*m.cost,0);
  const mv=MOV.filter(x=>x.note!=="Начальный остаток").sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id).slice(0,18);

  ${low.length?`<div class="note">⚠ Заканчивается: ${low.map(m=>esc(m.name)).join(", ")}</div>`:""}
  ${ow?`<div class="muted" style="margin-bottom:6px">Стоимость остатка на складе: <b>${rub(val)}</b></div>`:""}
  ${MATS.map(m=>{const st=stockOf(m.id),pc=Math.min(100,st/(m.min*3)*100);return `<div class="card"><div class="row"><b>${esc(m.name)}</b>${st<m.min?`<span class="tag bad">мало</span>`:`<span class="tag ok">в наличии</span>`}</div>
  <div class="row"><span>${Math.round(st*10)/10} ${m.unit} <span class="muted">≈ ${packsText(m,st)}</span></span><span class="muted sm">мин. ${m.min} ${m.unit}</span></div><div class="bar ${st<m.min?"low":""}" style="margin:6px 0"><i style="width:${pc}%"></i></div>
  <div class="muted sm">${m.packName} ${m.pack} ${m.unit}${ow?` · ${rub(m.packPrice)} за ${m.packName} · ${m.cost.toFixed(2)} ₽/${m.unit}`:""}</div></div>`}).join("")}
  <h2>Движение</h2><div class="tw"><table class="t lt"><thead><tr><th>Дата</th><th>Тип</th><th>Материал</th><th>Кол-во</th><th>Кому / за что</th>${ow?"<th>Сумма</th>":""}</tr></thead><tbody>
  ${mv.map(x=>{const mt=matById(x.mat),b=x.booking&&B.find(z=>z.id===x.booking);return `<tr><td>${x.date.split("-").reverse().slice(0,2).join(".")}</td><td>${{in:"приход",out:"расход",inv:"инвент."}[x.type]}</td><td>${esc(mt.name.split(" (")[0])}</td><td class="${x.qty>0?"pos":"neg"}">${x.qty>0?"+":""}${x.qty} ${mt.unit}</td><td>${b?esc(mById(x.master).name+" · "+cById(b.client).name):esc(x.note||"—")}</td>${ow?`<td>${rub(Math.abs(x.qty)*x.cost)}</td>`:""}</tr>`}).join("")}</tbody></table></div>
  <details class="card"><summary><b>Как это работает</b></summary><div class="sm" style="line-height:1.6">• Остаток хранится в граммах и миллилитрах, а не в тюбиках. Открыли тюбик, ушло 7 г — списали 7 г.<br>• <b>Приход</b>: сколько упаковок и по какой цене. Средняя цена грамма пересчитывается сама.<br>• <b>Расход</b>: мастер или администратор отмечает граммы прямо в записи клиента. Можно «по норме» одной кнопкой, можно вписать факт.<br>• Если ушло больше нормы на 20% — подсветка «перерасход».<br>• <b>Инвентаризация</b>: пересчитали руками — программа запишет разницу как излишек или потерю.<br>• Когда остаток ниже минимума — «мало» и список «что докупить».<br>• Владелец видит себестоимость каждого визита и маржу; администратор и мастера цен не видят.</div></details>`}

    body=`<h2 style="margin-top:0">Проверьте запись</h2><div class="card">${kv("Услуга",esc(sv.name))}${kv("Мастер",esc(mm.name))}${kv("Когда",dLong(w.date)+", "+w.time)}${kv("Клиент",esc(w.name)+" · "+esc(w.phone))}${disc?kv("Скидка первого визита",disc+"%"):""}<hr style="border:0;border-top:1px solid var(--line)">${kv("К оплате в салоне",rub(pr))}</div>`}
  const can=(w.step===1&&w.service)||(w.step===2&&w.master!=null)||(w.step===3&&w.time)||(w.step===4&&w.name&&digits(w.phone).length>=10)||w.step===5;
  const bar=w.step>=2?`<div class="sticky"><div class="row gap"><div class="sm"><b>${esc(sv.name)}</b><div class="muted">${mm?esc(mm.name):""}${w.time?" · "+dLong(w.date)+" "+w.time:""} · ${rub(sv.price)}</div></div>${w.step>=3||w.step===2?`<button class="btn ${w.step===5?"ok":""}" data-act="wnext" ${can?"":"disabled"}>${w.step===5?"Записаться":"Далее"}</button>`:""}</div></div>`:"";
  return head+body+bar}
function vMy(){const c=cById(S.me),bs=B.filter(b=>b.client===c.id&&b.status!=="cancelled").sort((a,b)=>a.date+a.start<b.date+b.start?1:-1),next=bs.filter(b=>b.date+" "+b.start>TODAY+" "+hm(NOWMIN)&&["new","confirmed"].includes(b.status)).sort((a,b)=>a.date+a.start>b.date+b.start?1:-1)[0];
  return `<div class="card"><div class="muted">Здравствуйте,</div><h2 style="margin:0">${esc(c.name)}</h2><div class="row" style="margin-top:8px"><span>Бонусные баллы</span><b class="k" style="font-size:22px">${c.bonus}</b></div><div class="muted sm">1 балл = 1 ₽, можно оплатить до 50% чека. Начисляем 5% с каждого визита.</div></div>
  ${next?`<div class="card"><b>Ближайшая запись</b><div>${dLong(next.date)}, ${next.start} · ${esc(svById(next.service).name)}</div><div class="muted">мастер ${esc(mById(next.master).name)}</div><button class="btn alt s" style="margin-top:6px" data-act="ccancel" data-id="${next.id}">Отменить запись</button></div>`:""}
  <h2>История визитов</h2>${bs.slice(0,15).map(b=>`<div class="card row"><div><b>${esc(svById(b.service).name)}</b><div class="muted">${dLong(b.date)}, ${b.start} · ${esc(mById(b.master).name)}</div></div><div style="text-align:right">${rub(total(b))}<br>${b.paid?`<span class="muted sm">+${Math.round(total(b)*.05)} баллов · чек ${b.paid.fiscal}</span>`:tag(b.status)}</div></div>`).join("")}
  <div class="note">В настоящем приложении вход запоминается в браузере, а с другого телефона — по номеру и коду.</div>`}

/* ===== действия ===== */
const A={
  role(el){S.role=el.dataset.v;closeModal();render()},reset(){seed();S.sess={};S.w={step:1};S.date=TODAY;S.open=0;closeModal();render()},
  fill(el){$("#lg").value=el.dataset.l;$("#pw").value=el.dataset.p},
  login(){const l=$("#lg").value.trim(),p=$("#pw").value;let ok=false;
    if(S.role==="master"){const m=MASTERS.find(x=>x.login===l&&x.pass===p);if(m){if(!m.active){$("#lerr").textContent="Доступ закрыт владельцем";return}S.sess.master=m.id;S.date=TODAY;ok=true}}
    else if(USERS[S.role].login===l&&USERS[S.role].pass===p){S.sess[S.role]=1;ok=true}
    if(ok)render();else $("#lerr").textContent="Неверный логин или пароль"},
  logout(){delete S.sess[S.role];render()},tab(el){S.tab[S.role]=el.dataset.t;render()},ctab(el){S.tab.client="book"===el.dataset.t?"book":"my";render()},
  dshift(el){S.date=addDays(S.date,+el.dataset.n);render()},dtoday(){S.date=TODAY;render()},cal(){calModal()},mday(el){S.date=el.dataset.d;S.mym=S.date.slice(0,7);render()},mmon(el){const [y,m]=(S.mym||S.date.slice(0,7)).split("-").map(Number),d=new Date(y,m-1+ +el.dataset.n,1);S.mym=d.getFullYear()+"-"+pad(d.getMonth()+1);render()},mtoday(){S.date=TODAY;S.mym=TODAY.slice(0,7);render()},
  bk(el){openSheet(+el.dataset.id)},slot(el,e){if(e.target!==el)return;const y=e.clientY-el.getBoundingClientRect().top,t=OPEN*60+Math.floor(y/ROW)*30;bookModal({master:+el.dataset.m,date:S.date,time:hm(t)})},
  new(){bookModal({date:S.date})},newfor(el){bookModal({date:TODAY});const c=cById(+el.dataset.id);setTimeout(()=>{const p=$("#bp");if(p){p.value="+"+c.phone;p.oninput()}},0)},
  close(){closeModal()},payb(el){payModal(+el.dataset.id)},extra(el){extraModal(+el.dataset.id)},editb(el){closeModal();bookModal({id:+el.dataset.id})},mats(el){matsModal(+el.dataset.id)},
  xdel(el,e){e.preventDefault();const b=B.find(x=>x.id===+el.dataset.id);b.extras.splice(+el.dataset.i,1);render();openSheet(b.id)},
  bst(el){const b=B.find(x=>x.id===+el.dataset.id),s=el.dataset.s;closeModal();ask(s==="noshow"?"Отметить неявку?":"Отменить запись?",()=>{b.status=s;render()})},
  clo(el){S.open=S.open===+el.dataset.id?0:+el.dataset.id;$("#cl").innerHTML=clList()},
  in(){stockModal("in")},out(){stockModal("out")},inv(){stockModal("inv")},buy(){stockModal("buy")},norms(){stockModal("norms")},
  per(el){S.period=el.dataset.p;render()},
  paym(el){const mm=mById(+el.dataset.id),m=modal(`<h2 style="margin-top:0">Выплата: ${esc(mm.name)}</h2><label class="l">Сумма, ₽</label><input id="ma" type="number" value="${el.dataset.b}"><div class="row"><button class="btn alt" data-act="close">Отмена</button><button class="btn ok" id="mok">Выплатить</button></div>`);
    m.querySelector("#mok").onclick=()=>{const a=Math.round(+m.querySelector("#ma").value);if(a>0)EXP.push({id:nid(),date:period(S.period).to,amount:a,cat:"salary",note:"Выплата",master:mm.id});m.remove();render()}},
  payday(){CFG.payDay=Math.min(28,Math.max(1,Math.round(+$("#pdy").value||5)));render()},
  reset2(){},toggle(el){const m=mById(+el.dataset.id);m.active=m.active?0:1;render()},
  addstaff(){const m=modal(`<h2 style="margin-top:0">Новый сотрудник</h2><label class="l">Имя</label><input id="sn"><label class="l">Должность</label><input id="sr" value="Парикмахер"><label class="l">Процент от услуг</label><input id="sp" type="number" value="40"><label class="l">Логин</label><input id="sl"><label class="l">Пароль</label><input id="sw"><div class="row"><button class="btn alt" data-act="close">Отмена</button><button class="btn ok" id="sok">Добавить</button></div>`);
    m.querySelector("#sok").onclick=()=>{const n=m.querySelector("#sn").value.trim(),l=m.querySelector("#sl").value.trim(),p=m.querySelector("#sw").value;if(!n||!l||p.length<4)return;MASTERS.push({id:nid(),name:n,role:m.querySelector("#sr").value,percent:Math.min(100,Math.max(0,+m.querySelector("#sp").value||40)),login:l,pass:p,color:"#2d8a8a",rating:5,active:1});m.remove();render()}},
  /* клиентский мастер записи */
  svc(el){svcModal(+el.dataset.id)},matE(el){matModal(+el.dataset.id)},normE(el){normModal(+el.dataset.id)},
  pcs(){document.querySelectorAll("[data-pc]").forEach(i=>{mById(+i.dataset.pc).percent=Math.min(100,Math.max(0,Math.round(+i.value||0)))});render()},
  salon(){CFG.name=$("#cn").value.trim()||CFG.name;CFG.addr=$("#ca").value.trim()||CFG.addr;CFG.payDay=Math.min(28,Math.max(1,Math.round(+$("#cp").value||5)));render()},
  wsv(el){S.w.service=+el.dataset.id;S.w.step=2;render()},
  wm(el){const w=W();w.master=+el.dataset.id;w.step=3;const sv=svById(w.service);w.time=null;w.date=Array.from({length:14},(_,i)=>addDays(TODAY,i)).find(d=>freeTimes(d,w.master,sv.dur).length)||TODAY;render()},
  wd(el){S.w.date=el.dataset.d;S.w.time=null;render()},wt(el){S.w.time=el.dataset.t;S.w.step=4;render()},wback(){S.w.step=Math.max(1,S.w.step-1);render()},
  wnext(){const w=W();if(w.step<5){w.step++;render();return}
    const sv=svById(w.service),ph=digits(w.phone).slice(-10);let c=CLIENTS.find(x=>digits(x.phone)===ph);const disc=c?0:15;if(!c){c={id:nid(),name:w.name,phone:"7"+ph,note:"",bonus:0};CLIENTS.push(c)}
    const slot=freeTimes(w.date,w.master,sv.dur).find(x=>x.t===w.time);if(!slot){w.step=3;render();modal(`<h2 style="margin-top:0">Это время только что заняли</h2><div class="muted">Выберите другое.</div><button class="btn full" data-act="close" style="margin-top:8px">Понятно</button>`);return}
    const b={id:nid(),date:w.date,master:w.master||slot.free[0],start:w.time,dur:sv.dur,service:sv.id,client:c.id,status:"new",price:Math.round(sv.price*(1-disc/100)),extras:[],note:w.note||"",source:"app"};B.push(b);S.me=c.id;w.done=b.id;render()},
  wnew(){S.w={step:1};render()},
  ccancel(el){const b=B.find(x=>x.id===+el.dataset.id);b.status="cancelled";render()},
};
A.reset=function(el){if(el.dataset.k||el.dataset.id){const np="pw"+(1000+Math.floor(Math.random()*9000)),t=el.dataset.k?USERS[el.dataset.k]:mById(+el.dataset.id);t.pass=np;modal(`<h2 style="margin-top:0">Новый пароль</h2><div class="card" style="font-size:22px;text-align:center"><b>${np}</b></div><div class="muted">Передайте сотруднику. Старый пароль больше не работает.</div><button class="btn full" data-act="close" style="margin-top:8px">Готово</button>`);return}
  seed();S.sess={};S.w={step:1};S.date=TODAY;S.open=0;closeModal();render()};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==="A")e.preventDefault();f(el,e)}});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;if(k==="cq"){S.q=e.target.value;$("#cl").innerHTML=clList()}else{const w=W();if(k==="wname")w.name=e.target.value;if(k==="wphone")w.phone=e.target.value;if(k==="wnote")w.note=e.target.value;const nb=document.querySelector("[data-act=wnext]");if(nb&&S.w.step===4)nb.disabled=!(w.name&&digits(w.phone).length>=10)}});
render();

function splash(){if(S.role!=="client")return;const el=document.createElement("div");el.id="splash";
  const nm=esc(CFG.name).replace("#8","<b>#8</b>");
  el.innerHTML=`<svg viewBox="0 0 120 120" aria-hidden="true"><g class="bl"><polygon class="blade" points="60,56 100,10 104,14 70,62"/><polygon class="tip" points="100,10 104,14 106,8"/><line x1="62" y1="60" x2="44" y2="84" stroke-width="5" stroke-linecap="round"/><circle class="ring" cx="38" cy="96" r="13"/></g><g transform="translate(120 0) scale(-1 1)"><g class="bl r"><polygon class="blade" points="60,56 100,10 104,14 70,62"/><polygon class="tip" points="100,10 104,14 106,8"/><line x1="62" y1="60" x2="44" y2="84" stroke-width="5" stroke-linecap="round"/><circle class="ring" cx="38" cy="96" r="13"/></g></g><circle class="fl" cx="60" cy="58" r="4.5"/></svg>
  <div class="nm">${nm}</div><div class="ln"></div><div class="sub">Запись онлайн</div><div class="hint">нажмите, чтобы пропустить</div>`;
  const done=()=>{el.remove()};el.onclick=done;document.body.appendChild(el);setTimeout(done,2900)}
splash();
